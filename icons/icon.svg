<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Cosmic Indigo to Radiant Sunset -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="78%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Cap Red Gradient -->
    <linearGradient id="capRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Skin Gradient -->
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fbd0b0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Squircle Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#skyGrad)" />
  <!-- Golden Border Rim -->
  <rect x="10" y="10" width="492" height="492" rx="105" fill="none" stroke="url(#goldRim)" stroke-width="12" />

  <!-- City Skyline Silhouette in Background -->
  <path d="M 60 360 L 60 220 L 110 220 L 110 260 L 160 260 L 160 180 L 220 180 L 220 360 Z" fill="#090e17" opacity="0.65" />
  <path d="M 300 360 L 300 190 L 350 190 L 350 240 L 410 240 L 410 210 L 460 210 L 460 360 Z" fill="#090e17" opacity="0.65" />

  <!-- Speed Perspective Tracks rushing into depth -->
  <polygon points="256,260 80,440 432,440" fill="#0f172a" opacity="0.8" />
  <!-- Railway Sleepers -->
  <line x1="210" y1="310" x2="302" y2="310" stroke="#f59e0b" stroke-width="6" opacity="0.8" />
  <line x1="175" y1="345" x2="337" y2="345" stroke="#f59e0b" stroke-width="8" opacity="0.85" />
  <line x1="135" y1="390" x2="377" y2="390" stroke="#f59e0b" stroke-width="11" opacity="0.9" />
  <line x1="90" y1="440" x2="422" y2="440" stroke="#f59e0b" stroke-width="14" opacity="0.95" />

  <!-- Golden Rails -->
  <line x1="256" y1="260" x2="110" y2="450" stroke="#38bdf8" stroke-width="8" />
  <line x1="256" y1="260" x2="402" y2="450" stroke="#38bdf8" stroke-width="8" />

  <!-- 3D RUNNER BOY HERO AVATAR (Subway Surfers Style with Red Backwards Cap) -->
  <g id="heroAvatar" filter="url(#shadow)">
    <!-- White Hoodie Collar & Shoulders -->
    <path d="M 170 380 Q 256 340 342 380 L 360 440 L 152 440 Z" fill="#f8fafc" />
    <!-- Blue Denim Vest Accent -->
    <path d="M 160 400 L 195 385 L 210 440 L 152 440 Z" fill="#2563eb" />
    <path d="M 352 400 L 317 385 L 302 440 L 360 440 Z" fill="#2563eb" />
    <!-- Hoodie Strings -->
    <line x1="230" y1="375" x2="230" y2="415" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
    <circle cx="230" cy="418" r="4" fill="#e2e8f0" />
    <line x1="282" y1="375" x2="282" y2="415" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" />
    <circle cx="282" cy="418" r="4" fill="#e2e8f0" />

    <!-- Neck -->
    <rect x="232" y="325" width="48" height="38" rx="10" fill="url(#skinTone)" />

    <!-- Head -->
    <ellipse cx="256" cy="275" rx="72" ry="76" fill="url(#skinTone)" />

    <!-- Cartoon Ears -->
    <circle cx="182" cy="275" r="16" fill="url(#skinTone)" />
    <circle cx="182" cy="275" r="9" fill="#fbcfe8" opacity="0.6" />
    <circle cx="330" cy="275" r="16" fill="url(#skinTone)" />
    <circle cx="330" cy="275" r="9" fill="#fbcfe8" opacity="0.6" />

    <!-- Flowing Caramel Skater Hair Locks -->
    <path d="M 188 245 C 175 290 205 285 200 310" stroke="#935116" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 324 245 C 337 290 307 285 312 310" stroke="#935116" stroke-width="16" stroke-linecap="round" fill="none" />
    <path d="M 215 235 C 235 250 250 230 270 235" stroke="#935116" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- RED BACKWARDS SNAPBACK CAP -->
    <!-- Cap Dome -->
    <path d="M 188 250 C 188 180 324 180 324 250 Z" fill="url(#capRed)" />
    <!-- White Top Button -->
    <ellipse cx="256" cy="180" rx="10" ry="7" fill="#ffffff" />
    <!-- Backwards Visor Brim with Stylish Tilt -->
    <path d="M 178 245 C 215 228 297 228 334 245 L 340 258 C 300 242 212 242 172 258 Z" fill="#b91c1c" />
    <!-- White Visor Trim Edge -->
    <path d="M 172 258 C 212 242 300 242 340 258" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Expressive Eyes -->
    <!-- Left Eye -->
    <ellipse cx="228" cy="275" rx="16" ry="20" fill="#ffffff" />
    <ellipse cx="231" cy="275" rx="10" ry="13" fill="#0284c7" />
    <circle cx="232" cy="275" r="6" fill="#090e17" />
    <circle cx="228" cy="270" r="3.5" fill="#ffffff" />

    <!-- Right Eye -->
    <ellipse cx="284" cy="275" rx="16" ry="20" fill="#ffffff" />
    <ellipse cx="281" cy="275" rx="10" ry="13" fill="#0284c7" />
    <circle cx="280" cy="275" r="6" fill="#090e17" />
    <circle cx="277" cy="270" r="3.5" fill="#ffffff" />

    <!-- Eyebrows -->
    <path d="M 214 248 Q 230 242 246 252" stroke="#935116" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 298 248 Q 282 242 266 252" stroke="#935116" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <circle cx="256" cy="290" r="5" fill="#ea580c" opacity="0.45" />

    <!-- Charming Smirk -->
    <path d="M 238 310 Q 256 325 278 308" stroke="#9a3412" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Speed Lightning Bolt & Star Badges -->
  <polygon points="100,100 130,55 115,105 145,105 90,165 105,115" fill="#facc15" filter="url(#badgeGlow)" />
  <polygon points="410,120 425,85 418,125 440,125 395,170 408,130" fill="#facc15" filter="url(#badgeGlow)" />

  <!-- Bottom 3D Title Banner Plaque -->
  <g transform="translate(0, 420)">
    <rect x="56" y="0" width="400" height="66" rx="22" fill="#0f172a" stroke="url(#goldRim)" stroke-width="4" filter="url(#shadow)" />
    <text x="256" y="38" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      URBAN DASH <tspan fill="#f59e0b">3D</tspan>
    </text>
  </g>
</svg>